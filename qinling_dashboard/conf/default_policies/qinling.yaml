# Default policies of qinling, generated from its policy-in-code by
# tools/generate_default_policies.py. Do not edit.
- check_str: role:admin
  description: 'Decides what is required for the ''is_admin:True'' check to succeed:
    an admin sees and manages the resources of every project.'
  name: context_is_admin
  operations: []
  scope_types:
  - project
- check_str: rule:context_is_admin or (role:reader and project_id:%(project_id)s)
  description: List executions.
  name: execution:get_all
  operations:
  - method: GET
    path: /v1/executions
  scope_types:
  - project
- check_str: rule:context_is_admin
  description: List the executions of all projects.
  name: execution:get_all:all_projects
  operations:
  - method: GET
    path: /v1/executions?all_projects=true
  scope_types:
  - project
- check_str: rule:context_is_admin or (role:reader and project_id:%(project_id)s)
  description: Show an execution.
  name: execution:get
  operations:
  - method: GET
    path: /v1/executions/{execution_id}
  scope_types:
  - project
- check_str: rule:context_is_admin or (role:reader and project_id:%(project_id)s)
  description: Show the log of an execution.
  name: execution:log_show
  operations:
  - method: GET
    path: /v1/executions/{execution_id}/log
  scope_types:
  - project
- check_str: rule:context_is_admin or (role:member and project_id:%(project_id)s)
  description: Run a function.
  name: execution:create
  operations:
  - method: POST
    path: /v1/executions
  scope_types:
  - project
- check_str: rule:context_is_admin or (role:member and project_id:%(project_id)s)
  description: Delete an execution.
  name: execution:delete
  operations:
  - method: DELETE
    path: /v1/executions/{execution_id}
  scope_types:
  - project
